<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrate</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    
    <header>
        <div class="header-top">
            <a href="./index.html" class="logo-link">
                <img src="../img/logo.png" alt="foto del logo" class="logo-img">
            </a>

            <form class="buscador" action="./search-result.html" method="GET">
                <input class="buscador-input" type="text" name="q" placeholder="Buscar perfumes...">
                <button class="buscador-boton" type="submit">Buscar</button>
            </form>

            <nav class="nav-superior">
                <ul class="menu">
                    <li class="menu-item"><a class="menu-link" href="./index.html">Home</a></li>
                    <li class="menu-item"><a class="menu-link" href="./login.html">Login</a></li>
                    <li class="menu-item"><a class="menu-link" href="./register.html">Registrate</a></li>
                </ul>
            </nav>
        </div>
    </header>

<main>
    <section class="contenido">


    <section class="principal registro">

        <h1 class="titulo-pagina">Creá tu cuenta</h1>

        <form class="formulario" action="./login.html" method="GET">

            <div class="campo-formulario">
                <label class="campo-etiqueta" for="email">Email</label>
                <input class="campo-input" type="email" id="email" name="email" placeholder="tu@email.com">
            </div>

            <div class="campo-formulario">
                <label class="campo-etiqueta" for="password">Contraseña</label>
                <input class="campo-input" type="password" id="password" name="password" placeholder="Elegí una contraseña">
            </div>

            <div class="campo-formulario">
                <label class="campo-etiqueta" for="password2">Repetir contraseña</label>
                <input class="campo-input" type="password" id="password2" name="password2" placeholder="Repetí la contraseña">
            </div>

            <div class="campo-fila">
                <input class="campo-radio-check" type="checkbox" id="terminos" name="terminos" value="aceptado">
                <label class="campo-etiqueta" for="terminos">Acepto términos y condiciones</label>
            </div>

            <button class="campo-boton" type="submit">Registrarme</button>

            <p><a class="link-login" href="./login.html">Ya tengo una cuenta</a></p>

        </form>

    </section>
    </section>

    
</main>
    <footer>
        <div class="footer-texto">
            Lombardi Lara, Costa Delfina y Luis munioz
        </div>
    </footer>
</body>
</html>
